<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 56px;
    overflow: hidden;
    background: #0f1b33;
    color: #e8eef9;
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }
  .bar {
    height: 56px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-bottom: 1px solid #243656;
  }
  button {
    height: 34px;
    border-radius: 8px;
    border: 1px solid #2d4268;
    background: #18294a;
    color: #e8eef9;
    padding: 0 10px;
    font: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s, border-color .12s, opacity .12s;
  }
  button:hover:not(:disabled) { background: #223862; border-color: #3f5d91; }
  button:disabled { opacity: .45; cursor: default; }
  .icon-btn { width: 34px; padding: 0; font-size: 15px; }
  .primary {
    background: #2563eb;
    border-color: #3b82f6;
    font-weight: 600;
    padding: 0 14px;
  }
  .primary:hover:not(:disabled) { background: #1d4ed8; border-color: #60a5fa; }
  .mid {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hint {
    color: #9cb3d9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  select {
    flex: 1;
    min-width: 0;
    height: 34px;
    border-radius: 8px;
    border: 1px solid #2d4268;
    background: #14223d;
    color: #e8eef9;
    padding: 0 10px;
    font: inherit;
    outline: none;
  }
  select:focus { border-color: #3b82f6; }
  .badge {
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 999px;
    background: #1e3a5f;
    color: #93c5fd;
    white-space: nowrap;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="bar">
    <button id="btnBack" class="icon-btn" title="Назад">◀</button>
    <button id="btnReload" class="icon-btn" title="Обновить">↻</button>
    <div class="mid">
      <span id="hint" class="hint"></span>
      <span id="badge" class="badge hidden">0</span>
      <select id="sel" class="hidden"></select>
    </div>
    <button id="btnClear" class="hidden"></button>
    <button id="btnPick" class="primary" disabled></button>
  </div>
<script>
  const api = window.snifferApi;
  const $ = (id) => document.getElementById(id);
  let selectedId = null;
  let knownIds = new Set();

  $('btnBack').onclick = () => api.back();
  $('btnReload').onclick = () => api.reload();
  $('btnClear').onclick = () => api.clear();
  $('btnPick').onclick = () => {
    const id = $('sel').value || selectedId;
    if (id) api.pick(id);
  };
  $('sel').onchange = () => { selectedId = $('sel').value; };

  api.onState((state) => {
    const L = state.labels || {};
    $('btnBack').title = L.back || 'Back';
    $('btnReload').title = L.reload || 'Reload';
    $('btnClear').textContent = L.clear || 'Clear';
    $('btnPick').textContent = L.pick || 'Capture video';

    const ext = !!state.externalBrowser;
    $('btnBack').classList.toggle('hidden', ext);
    $('btnReload').classList.toggle('hidden', ext);

    const list = Array.isArray(state.streams) ? state.streams : [];
    const has = list.length > 0;

    $('hint').textContent = state.hint || '';
    $('hint').classList.toggle('hidden', has);
    $('badge').textContent = String(list.length);
    $('badge').classList.toggle('hidden', !has);
    $('sel').classList.toggle('hidden', !has);
    $('btnClear').classList.toggle('hidden', !has);
    $('btnPick').disabled = !has || !!state.busy;

    if (!has) {
      selectedId = null;
      knownIds.clear();
      $('sel').innerHTML = '';
      return;
    }

    // Если появился новый поток — автоматически выбираем самый свежий (первый в списке)
    const newest = list[0];
    const hasNew = list.some((s) => !knownIds.has(s.id));
    knownIds = new Set(list.map((s) => s.id));
    if (hasNew || !selectedId || !knownIds.has(selectedId)) {
      selectedId = newest.id;
    }

    $('sel').innerHTML = '';
    for (const s of list) {
      const opt = document.createElement('option');
      opt.value = s.id;
      opt.textContent = s.label;
      if (s.id === selectedId) opt.selected = true;
      $('sel').appendChild(opt);
    }
  });

  api.ready();
</script>
</body>
</html>
